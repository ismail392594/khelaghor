<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>খেলাঘর · ইন্টারনেট নেই</title>
<meta name="theme-color" content="#2f3cc9">
<link rel="icon" href="/icons/icon-192.png">
<style>
html{background:#1a1460}
body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;color:#fff;font-family:'Noto Sans Bengali','Hind Siliguri',system-ui,sans-serif;
  background:radial-gradient(700px 360px at 50% 0,#4b5cff 0,transparent 70%),linear-gradient(180deg,#2f3cc9,#5a1fa8 60%,#1a1460);
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.box{max-width:340px;display:flex;flex-direction:column;align-items:center;gap:12px}
img{width:96px;height:96px;border-radius:24px;box-shadow:0 8px 0 rgba(0,0,0,.2)}
h1{margin:0;font-size:1.6rem}
p{margin:0;color:#d9d4ff}
button{border:0;border-radius:16px;padding:12px 22px;font:700 1.1rem inherit;font-family:inherit;color:#fff;cursor:pointer;background:linear-gradient(180deg,#5ee28a,#22c55e 55%,#16a34a);box-shadow:0 5px 0 #15803d}
</style></head><body>
<div class="box">
  <img src="/icons/icon-192.png" alt="খেলাঘর">
  <h1>ইন্টারনেট নেই!</h1>
  <p>লোডশেডিং নাকি ডাটা শেষ? সংযোগ ফিরলে আবার চেষ্টা করুন। আগে খোলা লুডু অফলাইনেও খেলা যাবে।</p>
  <button onclick="location.reload()">আবার চেষ্টা</button>
  <p><a href="/games/ludo/" style="color:#ffd23f">অফলাইনে লুডু খেলুন</a></p>
</div>
</body></html>
