<!doctype html><html><body style="margin:0;background:transparent">
<!-- দূরের ভিড়ের ছবি বানানো: kh-people-এর বাংলাদেশি মানুষ দাঁড়ানো ভঙ্গিতে, স্বচ্ছ পটভূমিতে। tools/people/atlas.cjs চালায়। -->
<script type="module">
import * as THREE from "/js/vendor/three.module.min.js";
import { GLTFLoader } from "/js/vendor/addons/GLTFLoader.js";
import { MeshoptDecoder } from "/js/vendor/addons/meshopt_decoder.module.js";
import { clone } from "/js/vendor/addons/SkeletonUtils.js";
import { loadPeople } from "/js/kh-people.js";
const r = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true }); r.setClearColor(0, 0); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping;
const sc = new THREE.Scene(); sc.add(new THREE.HemisphereLight('#eef2ff', '#7a6a50', 1.3)); const sun = new THREE.DirectionalLight('#fff2dd', 2.2); sun.position.set(-3, 5, 6); sc.add(sun);
const P = await loadPeople(THREE, GLTFLoader, MeshoptDecoder, clone);
// job: [make-index, yaw, crop(0 পুরো শরীর / 1 কোমর থেকে উপরে)]
window.cell = (idx, yaw, seat, W, H) => { r.setSize(W, H); const h = P.make(idx, { scale: 1, shadow: false }); sc.add(h.root); h.root.rotation.y = yaw; for (let k = 0; k < 40; k++) h.update(1 / 30, 0, 1);
  const cam = new THREE.PerspectiveCamera(seat ? 22 : 16, W / H, .1, 50); if (seat) { cam.position.set(0, 1.25, 4.2); cam.lookAt(0, 1.22, 0); } else { cam.position.set(0, .86, 7.2); cam.lookAt(0, .86, 0); }
  r.render(sc, cam); sc.remove(h.root); return r.domElement.toDataURL('image/png'); };
window.READY = 1;
</script></body></html>
