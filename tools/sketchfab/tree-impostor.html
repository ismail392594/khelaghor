<!doctype html><html><body style="margin:0;background:transparent">
<script type="importmap">{"imports":{"three":"./three/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './three/examples/jsm/loaders/GLTFLoader.js';
const name = location.hash.slice(1);
const r = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
r.setSize(1024, 1024); r.setClearColor(0, 0); r.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(r.domElement);
const sc = new THREE.Scene();
sc.add(new THREE.HemisphereLight(0xcfe3ff, 0x6b5a40, 1.3));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.6); sun.position.set(-3, 5, 6); sc.add(sun);
new GLTFLoader().load(`../dl/m/${name}/${name}.gltf`, g => {
  const o = g.scene; sc.add(o);
  o.traverse(m => { if (m.material) { m.material.alphaTest = 0.5; m.material.transparent = false; m.material.side = THREE.DoubleSide; } });
  const b = new THREE.Box3().setFromObject(o), s = b.getSize(new THREE.Vector3()), c = b.getCenter(new THREE.Vector3());
  const h = Math.max(s.y, s.x, s.z) / 2 * 1.02;
  const cam = new THREE.OrthographicCamera(-h, h, h, -h, 0.1, 1000);
  cam.position.set(c.x, c.y, c.z + 100); cam.lookAt(c);
  r.render(sc, cam);
  window.DONE = { size: [s.x, s.y, s.z], url: r.domElement.toDataURL('image/png') };
});
</script></body></html>
